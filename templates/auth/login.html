{% extends "base.html" %}
{% block title %}Sign In : ProjectorShop{% endblock %}

{% block content %}
<div class="auth-container" style="max-width: 440px; margin: 2rem auto 3rem auto;">
  <div class="auth-card">
    <div class="text-center">
      <div class="auth-icon-badge">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Enter your email and password to access your account.</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
      <!-- Email Address -->
      <div class="mb-3">
        <label for="email" class="auth-label">Email Address</label>
        <div class="auth-input-group">
          <span class="auth-input-icon"><i class="bi bi-envelope"></i></span>
          <input type="email" id="email" name="email" placeholder="name@example.com"
                 required autofocus value="{{ request.form.get('email', '') }}" />
        </div>
      </div>

      <!-- Password -->
      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="password" class="auth-label mb-0">Password</label>
        </div>
        <div class="auth-input-group">
          <span class="auth-input-icon"><i class="bi bi-lock"></i></span>
          <input type="password" id="password" name="password" placeholder="Enter your password" required />
          <button type="button" class="toggle-pw-btn" onclick="togglePasswordVisibility('password', this)" title="Show / Hide Password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-auth-submit">
        <span>Sign In to Account</span>
        <i class="bi bi-arrow-right"></i>
      </button>
    </form>

    <!-- Switch to Register -->
    <div class="text-center mt-4 pt-3 border-top">
      <p class="text-muted small mb-0">
        Don't have an account?
        <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold text-decoration-none">Create an account</a>
      </p>
    </div>

    <!-- Quick Demo Accounts for Viva / Testing Convenience -->
    <div class="auth-quick-accounts">
      <div class="d-flex align-items-center justify-content-between text-muted fw-semibold mb-1.5" style="font-size: 0.725rem; text-transform: uppercase; letter-spacing: 0.5px;">
        <span><i class="bi bi-key me-1 text-primary"></i>Demo Test Accounts</span>
        <span class="text-muted fw-normal">Click to fill</span>
      </div>
      <div class="d-flex flex-wrap gap-1.5">
        <button type="button" class="btn btn-light btn-sm border py-0.5 px-2 rounded-2" style="font-size: 0.725rem;"
                onclick="fillLogin('admin@projectorshop.com', 'ProjAdmin#2026!Secure')">
          <span class="badge bg-warning text-dark me-1" style="font-size: 0.65rem;">Admin</span>admin@projectorshop.com
        </button>
        <button type="button" class="btn btn-light btn-sm border py-0.5 px-2 rounded-2" style="font-size: 0.725rem;"
                onclick="fillLogin('staff@projectorshop.com', 'ProjStaff#2026!Secure')">
          <span class="badge bg-info text-dark me-1" style="font-size: 0.65rem;">Staff</span>staff@projectorshop.com
        </button>
        <button type="button" class="btn btn-light btn-sm border py-0.5 px-2 rounded-2" style="font-size: 0.725rem;"
                onclick="fillLogin('alice@example.com', 'Alice#Pass2026$')">
          <span class="badge bg-secondary me-1" style="font-size: 0.65rem;">Customer</span>alice@example.com
        </button>
      </div>
    </div>
  </div>
</div>

<script>
function togglePasswordVisibility(inputId, btn) {
  const input = document.getElementById(inputId);
  const icon = btn.querySelector('i');
  if (input.type === 'password') {
    input.type = 'text';
    icon.classList.remove('bi-eye');
    icon.classList.add('bi-eye-slash');
  } else {
    input.type = 'password';
    icon.classList.remove('bi-eye-slash');
    icon.classList.add('bi-eye');
  }
}

function fillLogin(email, pass) {
  document.getElementById('email').value = email;
  document.getElementById('password').value = pass;
}
</script>
{% endblock %}
