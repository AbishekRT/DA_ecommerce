{% extends "base.html" %}
{% block title %}Sign In : ProjectorShop{% endblock %}

{% block content %}
<div class="auth-container" style="max-width: 440px; margin: 2rem auto 3rem auto;">
  <div class="auth-card">
    <div class="text-center">
      <div class="auth-icon-badge">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Enter your email and password to access your account.</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next') or request.form.get('next', '')) if (request.args.get('next') or request.form.get('next')) else url_for('auth.login') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <input type="hidden" name="next" value="{{ request.args.get('next') or request.form.get('next', '') }}" />
      <!-- Email Address -->
      <div class="mb-3">
        <label for="email" class="auth-label">Email Address</label>
        <div class="auth-input-group">
          <span class="auth-input-icon"><i class="bi bi-envelope"></i></span>
          <input type="email" id="email" name="email" placeholder="name@example.com"
                 required autofocus value="{{ request.form.get('email', '') }}" />
        </div>
      </div>

      <!-- Password -->
      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="password" class="auth-label mb-0">Password</label>
        </div>
        <div class="auth-input-group">
          <span class="auth-input-icon"><i class="bi bi-lock"></i></span>
          <input type="password" id="password" name="password" placeholder="Enter your password" required />
          <button type="button" class="toggle-pw-btn" onclick="togglePasswordVisibility('password', this)" title="Show / Hide Password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-auth-submit">
        <span>Sign In to Account</span>
        <i class="bi bi-arrow-right"></i>
      </button>
    </form>

    <!-- Switch to Register -->
    <div class="text-center mt-4 pt-3 border-top">
      <p class="text-muted small mb-0">
        Don't have an account?
        <a href="{{ url_for('auth.register', next=request.args.get('next') or request.form.get('next', '')) if (request.args.get('next') or request.form.get('next')) else url_for('auth.register') }}" class="text-primary fw-semibold text-decoration-none">Create an account</a>
      </p>
    </div>
  </div>
</div>

<script>
function togglePasswordVisibility(inputId, btn) {
  const input = document.getElementById(inputId);
  const icon = btn.querySelector('i');
  if (input.type === 'password') {
    input.type = 'text';
    icon.classList.remove('bi-eye');
    icon.classList.add('bi-eye-slash');
  } else {
    input.type = 'password';
    icon.classList.remove('bi-eye-slash');
    icon.classList.add('bi-eye');
  }
}
</script>
{% endblock %}
